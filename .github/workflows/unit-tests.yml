name: unit-tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize] }
  push: { branches: [main] }
  schedule:
    - cron: "0 6 * * 6"

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  check-ci-config:
    runs-on: ubuntu-26.04

    timeout-minutes: 5

    env:
      IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    outputs:
      android: ${{ steps.ci-config.outputs.android }}
      embedded: ${{ steps.ci-config.outputs.embedded }}
      musl: ${{ steps.ci-config.outputs.musl }}
      wasm: ${{ steps.ci-config.outputs.wasm }}
      windows: ${{ steps.ci-config.outputs.windows }}
      cxx-interoperability-arguments: ${{ steps.ci-config.outputs.cxx-interoperability-arguments }}
      android-swift-build-arguments: ${{ steps.ci-config.outputs.android-swift-build-arguments }}
      wasi-swift-build-arguments: ${{ steps.ci-config.outputs.wasi-swift-build-arguments }}

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the ci config of the base branch
        if: ${{ env.IS_FORK_PULL_REQUEST == 'true' }} # A fork must not turn off the jobs that check it
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-ref
          sparse-checkout: |
            .github/ci-config.yml
            .github/ci-config.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the ci config
        id: ci-config
        env:
          CI_CONFIG_DIR: ${{ env.IS_FORK_PULL_REQUEST == 'true' && 'base-ref/.github' || '.github' }}
        run: .github/scripts/ci-config.sh >> "${GITHUB_OUTPUT}"

  linux-unit:
    strategy:
      fail-fast: false
      matrix:
        swift-image:
          - name: swift:6.3-noble
          - name: swift:6.4-resolute
        config:
          - mode: "debug"
          - mode: "release"
        include:
          - swift-image: { name: swift:6.3-noble }
            runner: ubuntu-24.04
          - swift-image: { name: swift:6.4-resolute }
            runner: ubuntu-26.04

    runs-on: ${{ matrix.runner }}

    container: ${{ matrix.swift-image.name }}

    timeout-minutes: 15

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    env:
      ASAN_OPTIONS: "detect_leaks=1"

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y zstd curl jq

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Restore .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift-image.name }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift-image.name }}-${{ runner.os }}-"

      - name: Build ${{ github.event.repository.name }}
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          swift build \
            --build-tests \
            --disable-xctest \
            --enable-code-coverage \
            --sanitize=address \
            --explicit-target-dependency-import-check error \
            -Xswiftc -require-explicit-sendable \
            -c ${{ matrix.config.mode }}

      - name: Cache .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift-image.name }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"

      - name: Run tests
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          swift test \
            --skip "IntegrationTests." \
            --skip-build \
            --disable-xctest \
            --enable-code-coverage \
            --sanitize=address \
            -Xswiftc -require-explicit-sendable \
            -c ${{ matrix.config.mode }}

      - name: Submit code coverage
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        uses: vapor/swift-codecov-action@855faf6b50974544c7ab3da724f49e602e43edc6 # v0.3.6
        with:
          build_parameters: "-c ${{ matrix.config.mode }}"
          codecov_token: "${{ secrets.CODECOV_TOKEN }}"

  cache-swiftly-toolchain-for-macos:
    strategy:
      fail-fast: false
      matrix:
        swift:
          - version: 6.3
          - version: 6.4

    runs-on: macos-26

    timeout-minutes: 20

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    env:
      SWIFTLY_HOME_DIR: "/Users/runner/.swiftly"
      SWIFTLY_BIN_DIR: "/Users/runner/.swiftly/bin"
      SWIFTLY_TOOLCHAINS_DIR: "/Users/runner/Library/Developer/Toolchains"

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update bash via Homebrew
        run: brew install bash

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Restore swiftly home
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-home"
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.SWIFTLY_HOME_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-home-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Restore swiftly bin
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-bin"
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.SWIFTLY_BIN_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-bin-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Restore swiftly toolchains
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-toolchains"
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.SWIFTLY_TOOLCHAINS_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-toolchain-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Update swift via Swiftly
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          # Installation commands from https://www.swift.org/install/macos
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "${SWIFTLY_BIN_DIR}/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR}/env.sh"

          # Update GitHub PATH
          printf '%s\n' "${SWIFTLY_BIN_DIR}" >>"${GITHUB_PATH}"

          # Update swift
          swiftly install --assume-yes ${{ matrix.swift.version }}
          swiftly use --assume-yes ${{ matrix.swift.version }}

      - name: Cache swiftly home
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-home.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: "${{ env.SWIFTLY_HOME_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-home-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Cache swiftly bin
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-bin.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: "${{ env.SWIFTLY_BIN_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-bin-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Cache swiftly toolchains
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: "${{ env.SWIFTLY_TOOLCHAINS_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-toolchain-${{ matrix.swift.version }}-${{ runner.os }}"

  macos-unit:
    strategy:
      fail-fast: false
      matrix:
        macos:
          - version: macos-15
          - version: macos-26
        xcode:
          - version: latest-stable
        swift:
          - version: 6.3
          - version: 6.4
        config:
          - mode: "debug"
          - mode: "release"

    runs-on: ${{ matrix.macos.version }}

    needs: cache-swiftly-toolchain-for-macos

    timeout-minutes: 20

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    env:
      ASAN_OPTIONS: "detect_leaks=1"
      LSAN_OPTIONS: "suppressions=.github/lsan-suppressions.txt:print_suppressions=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      SWIFTLY_HOME_DIR: "/Users/runner/.swiftly"
      SWIFTLY_BIN_DIR: "/Users/runner/.swiftly/bin"
      SWIFTLY_TOOLCHAINS_DIR: "/Users/runner/Library/Developer/Toolchains"

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update bash via Homebrew
        run: brew install bash

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Setup appropriate Xcode version
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}

      - name: Restore swiftly home
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        id: "restore-home"
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.SWIFTLY_HOME_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-home-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Restore swiftly bin
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        id: "restore-bin"
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.SWIFTLY_BIN_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-bin-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Restore swiftly toolchains
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        id: "restore-toolchains"
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.SWIFTLY_TOOLCHAINS_DIR }}"
          key: "${{ github.event.repository.name }}-swiftly-toolchain-${{ matrix.swift.version }}-${{ runner.os }}"

      - name: Update swift via Swiftly
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          # Workaround some kind of GitHub caching issue where it struggles to restore or cache the swiftly toolchain
          if [[ -d '${{ env.SWIFTLY_TOOLCHAINS_DIR }}' ]]; then
            BLOCK_SIZE="$(du -s '${{ env.SWIFTLY_TOOLCHAINS_DIR }}' | awk '{print $1}')"
          else
            BLOCK_SIZE=0
          fi
          if [[ "${BLOCK_SIZE}" -lt 1024 ]]; then
            printf '%s\n' "Toolchain directory is too small (${BLOCK_SIZE} blocks), deleting all swiftly directories for fresh installation"
            rm -rf '${{ env.SWIFTLY_TOOLCHAINS_DIR }}' '${{ env.SWIFTLY_BIN_DIR }}' '${{ env.SWIFTLY_HOME_DIR }}'
          else
            printf '%s\n' "Toolchain directory is large enough (${BLOCK_SIZE} blocks), will use the restored toolchain"
          fi

          # Installation commands from https://www.swift.org/install/macos
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "${SWIFTLY_BIN_DIR}/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR}/env.sh"

          # Update GitHub PATH
          printf '%s\n' "${SWIFTLY_BIN_DIR}" >>"${GITHUB_PATH}"

          # Update swift
          swiftly install --assume-yes ${{ matrix.swift.version }}
          swiftly use --assume-yes ${{ matrix.swift.version }}

      - name: Restore .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ matrix.macos.version }}-${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ matrix.macos.version }}-"

      - name: Build ${{ github.event.repository.name }}
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          swift build \
            --build-tests \
            --disable-xctest \
            --enable-code-coverage \
            --sanitize=address --sanitize=undefined \
            --explicit-target-dependency-import-check error \
            -Xswiftc -require-explicit-sendable \
            -c ${{ matrix.config.mode }}

      - name: Cache .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ matrix.macos.version }}-${{ hashFiles('./Package.resolved') }}"

      - name: Run tests
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          swift test \
            --skip "IntegrationTests." \
            --skip-build \
            --disable-xctest \
            --enable-code-coverage \
            --sanitize=address --sanitize=undefined \
            -Xswiftc -require-explicit-sendable \
            -c ${{ matrix.config.mode }}

      - name: Submit code coverage
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        uses: vapor/swift-codecov-action@855faf6b50974544c7ab3da724f49e602e43edc6 # v0.3.6
        with:
          build_parameters: "-c ${{ matrix.config.mode }}"
          codecov_token: "${{ secrets.CODECOV_TOKEN }}"

  windows-unit:
    strategy:
      fail-fast: false
      matrix:
        windows:
          - version: windows-2025
        swift:
          - version: 6.3.3
          - version: 6.4.0
        config:
          - mode: "debug"
          - mode: "release"

    runs-on: ${{ matrix.windows.version }}

    needs: check-ci-config
    if: ${{ needs.check-ci-config.outputs.windows == 'true' }}

    timeout-minutes: 20

    env:
      CXX_INTEROPERABILITY_ARGUMENTS: ${{ needs.check-ci-config.outputs.cxx-interoperability-arguments }}

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Update swift
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6 # v0.4.1
        with:
          swift-version: swift-${{ matrix.swift.version }}-release
          swift-build: ${{ matrix.swift.version }}-RELEASE

      - name: Restore .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ matrix.windows.version }}-${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ matrix.windows.version }}-"

      - name: Build ${{ github.event.repository.name }}
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          swift build \
            --build-tests \
            --disable-xctest \
            --explicit-target-dependency-import-check error \
            -Xswiftc -require-explicit-sendable \
            ${CXX_INTEROPERABILITY_ARGUMENTS} \
            -c ${{ matrix.config.mode }}

      - name: Cache .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ matrix.windows.version }}-${{ hashFiles('./Package.resolved') }}"

      - name: Run tests
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          swift test \
            --skip "IntegrationTests." \
            --skip-build \
            --disable-xctest \
            -Xswiftc -require-explicit-sendable \
            ${CXX_INTEROPERABILITY_ARGUMENTS} \
            -c ${{ matrix.config.mode }}

  android-unit:
    strategy:
      fail-fast: false
      matrix:
        swift:
          - version: 6.3
          - version: 6.4.0
        config:
          - mode: "debug"
          - mode: "release"
        include:
          - swift: { version: 6.3 }
            runner: ubuntu-24.04
          - swift: { version: 6.4.0 }
            runner: ubuntu-26.04

    runs-on: ${{ matrix.runner }}

    needs: check-ci-config
    if: ${{ needs.check-ci-config.outputs.android == 'true' }}

    timeout-minutes: 30

    env:
      ANDROID_SWIFT_BUILD_ARGUMENTS: ${{ needs.check-ci-config.outputs.android-swift-build-arguments }}

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Replace symlinks with the actual files
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        run: find . -type l -exec sh -c 'LINKED="$(readlink -f "{}")"; rm "{}"; cp -a "${LINKED}" "{}"' \;

      - name: Restore .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-android-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ github.event.repository.name }}-unit-tests-android-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ runner.os }}-"

      - name: Run tests
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          # Ubuntu runners low on space causes the emulator to fail to install
          free-disk-space: true
          android-emulator-test-folder: /data/local/tmp/android-xctest
          android-emulator-options: >-
            -no-window
            -noaudio
            -no-boot-anim
            -memory 4096
          test-env: PROJECT_ROOT_FOR_TESTING=/data/local/tmp/android-xctest
          swift-version: ${{ matrix.swift.version }}
          swift-configuration: ${{ matrix.config.mode }}
          copy-files: Tests
          swift-build-flags: >-
            --build-tests
            --disable-xctest
            --explicit-target-dependency-import-check error
            ${ANDROID_SWIFT_BUILD_ARGUMENTS}
          swift-test-flags: --skip "IntegrationTests."

      - name: Cache .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-android-${{ matrix.config.mode }}-build-${{ matrix.swift.version }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"

  musl-unit:
    strategy:
      fail-fast: false
      matrix:
        swift:
          - image: swift:6.3-noble
            version: 6.3
          - image: swift:6.4-resolute
            version: 6.4
        config:
          - mode: "debug"
          - mode: "release"
        include:
          - swift: { image: swift:6.3-noble }
            runner: ubuntu-24.04
          - swift: { image: swift:6.4-resolute }
            runner: ubuntu-26.04

    runs-on: ${{ matrix.runner }}

    needs: check-ci-config
    if: ${{ needs.check-ci-config.outputs.musl == 'true' }}

    container: ${{ matrix.swift.image }}

    timeout-minutes: 30

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y zstd curl jq

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Restore .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-musl-${{ matrix.config.mode }}-build-${{ matrix.swift.image }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ github.event.repository.name }}-unit-tests-musl-${{ matrix.config.mode }}-build-${{ matrix.swift.image }}-${{ runner.os }}-"

      # The Static Linux SDK ships no static swift-testing or XCTest, so the tests can only be compiled for glibc.
      - name: Build ${{ github.event.repository.name }}
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        env:
          SDK: static
          SWIFT_VERSION: ${{ matrix.swift.version }}
          BUILD_MODE: ${{ matrix.config.mode }}
          BUILD_FLAGS: >-
            --explicit-target-dependency-import-check error
            -Xswiftc -require-explicit-sendable
        run: .github/scripts/build-with-sdk.sh

      - name: Cache .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-musl-${{ matrix.config.mode }}-build-${{ matrix.swift.image }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"

  wasi-unit:
    strategy:
      fail-fast: false
      matrix:
        swift:
          - image: swift:6.3-noble
            version: 6.3
          - image: swift:6.4-resolute
            version: 6.4
        config:
          - mode: "debug"
          - mode: "release"
        include:
          - swift: { image: swift:6.3-noble }
            runner: ubuntu-24.04
          - swift: { image: swift:6.4-resolute }
            runner: ubuntu-26.04

    runs-on: ${{ matrix.runner }}

    needs: check-ci-config
    if: ${{ needs.check-ci-config.outputs.wasm == 'true' }}

    container: ${{ matrix.swift.image }}

    timeout-minutes: 30

    env:
      WASI_SWIFT_BUILD_ARGUMENTS: ${{ needs.check-ci-config.outputs.wasi-swift-build-arguments }}

    permissions:
      actions: read # For reading the previous commit's workflow runs
      contents: read

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y zstd curl jq xz-utils

      - name: Check relevance
        id: check-relevance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHOULD_RUN="$(.github/scripts/check-relevance.sh)"
          printf '%s\n' "should-run=${SHOULD_RUN}" >> "${GITHUB_OUTPUT}"

      - name: Restore .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && runner.debug != '1' }}
        id: "restore-cache"
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-wasi-${{ matrix.config.mode }}-build-${{ matrix.swift.image }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"
          restore-keys: "${{ github.event.repository.name }}-unit-tests-wasi-${{ matrix.config.mode }}-build-${{ matrix.swift.image }}-${{ runner.os }}-"

      - name: Build ${{ github.event.repository.name }}
        if: ${{ steps.check-relevance.outputs.should-run == 'true' }}
        env:
          SDK: wasm
          SWIFT_VERSION: ${{ matrix.swift.version }}
          BUILD_MODE: ${{ matrix.config.mode }}
          BUILD_FLAGS: >-
            --disable-xctest
            ${{ env.WASI_SWIFT_BUILD_ARGUMENTS
            || '--build-tests --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable' }}
        run: .github/scripts/build-with-sdk.sh

      - name: Cache .build
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: "${{ github.event.repository.name }}-unit-tests-wasi-${{ matrix.config.mode }}-build-${{ matrix.swift.image }}-${{ runner.os }}-${{ hashFiles('./Package.resolved') }}"

      # A repository that replaced the flags above dropped '--build-tests' from them, so it has no
      # test bundle to run here.
      - name: Run tests with wasmtime
        if: ${{ steps.check-relevance.outputs.should-run == 'true' && env.WASI_SWIFT_BUILD_ARGUMENTS == '' }}
        env:
          BUILD_MODE: ${{ matrix.config.mode }}
          WASMTIME_VERSION: "48.0.1"
          WASMTIME_SHA256: "4c2e31b68ad99e0a519f225a261fda099eb15f056d4a24fdb3c2a46517bde1df"
          TEST_FLAGS: >-
            --skip IntegrationTests.
        run: .github/scripts/test-with-wasmtime.sh

