name: update-benchmark-thresholds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_count:
        description: "Number of times to run each benchmark and update the thresholds."
        required: true
        type: number
        default: 500
      pr_number:
        description: "Pull Request number to comment on. If not provided, the workflow will not comment any PRs."
        required: false
        type: number
      target:
        description: "Regex filter for benchmark target names that contains the benchmarks to run. If not provided, all targets will be run."
        required: false
        type: string
      filter:
        description: "Regex filter for benchmark names. If not provided, all benchmarks will be run."
        required: false
        type: string
      skip:
        description: "Regex filter for benchmark names to skip. If not provided, no benchmarks will be skipped."
        required: false
        type: string
      swift_version:
        description: "Swiftly Swift toolchain selector string to run benchmarks with. Empty uses the machine default. Example: '6.4.x-snapshot'. Must be pre-installed on the machine."
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

env:
  RUN_LINK: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  THRESHOLDS_PATH: "Benchmarks/Thresholds/"
jobs:
  check-ci-config:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    outputs:
      enabled: ${{ steps.ci-config.outputs.enabled }}

    steps:
      - name: Check out ${{ github.event.repository.name }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the ci config
        id: ci-config
        env:
          JOB_KEYS: "benchmarks"
        run: |
          ENABLED="$(.github/scripts/ci-config.sh)"
          printf '%s\n' "enabled=${ENABLED}" >> "${GITHUB_OUTPUT}"

  update-benchmark-thresholds:
    needs: check-ci-config
    if: ${{ needs.check-ci-config.outputs.enabled == 'true' }}

    runs-on: [self-hosted, linux, x64]

    timeout-minutes: 1440

    permissions:
      pull-requests: write # For the comment action
      contents: write # For the committing the changes

    env:
      TOOLCHAIN_MODIFIER: ${{ inputs.swift_version && format('+{0}', inputs.swift_version) || '' }}

    steps:
      - name: Generate swift-dns-helper token
        id: app-token-initial
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SWIFT_DNS_HELPER_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_DNS_HELPER_PRIVATE_KEY }}

      - name: Enable full performance
        run: set-perf-mode performance

      - name: Construct in-progress comment
        if: ${{ inputs.pr_number != '' }}
        run: |
          printf '%s\n' "## [Benchmark Thresholds Update](${RUN_LINK}) Report" >> in-progress-comment.md
          printf '%s\n' 'Thresholds update in progress...' >> in-progress-comment.md

      - name: Comment in PR
        if: ${{ inputs.pr_number != '' }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          github-token: ${{ steps.app-token-initial.outputs.token }}
          pr-number: ${{ inputs.pr_number }}
          file-path: in-progress-comment.md
          comment-tag: benchmark-thresholds-update-comment

      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git remote set-url origin "https://x-access-token:${{ steps.app-token-initial.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Resolve Swift toolchain for cache key
        id: swift-toolchain
        run: |
          SWIFT_VERSION_OUTPUT="$(swiftly run swift ${TOOLCHAIN_MODIFIER} --version)"
          TOOLCHAIN_ID="$(printf '%s\n' "${SWIFT_VERSION_OUTPUT}" | sed -n 's/.*Swift version \([^ ]*\).*/\1/p' | head -n 1)"
          if [[ -z "${TOOLCHAIN_ID}" ]]; then
            printf '%s\n' "Failed to resolve Swift toolchain version from 'swift --version' output:" >&2
            printf '%s\n' "${SWIFT_VERSION_OUTPUT}" >&2
            exit 1
          fi
          printf '%s\n' "version=${TOOLCHAIN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Restore .build
        if: ${{ runner.debug != '1' }}
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: Benchmarks/.build
          key: "swiftpm-benchmark-build-${{ runner.os }}-${{ steps.swift-toolchain.outputs.version }}-${{ github.sha }}"
          restore-keys: "swiftpm-benchmark-build-${{ runner.os }}-${{ steps.swift-toolchain.outputs.version }}-"

      - name: Update benchmark thresholds
        env:
          TARGET: ${{ inputs.target }}
          FILTER: ${{ inputs.filter }}
          SKIP: ${{ inputs.skip }}
          RUN_COUNT: ${{ inputs.run_count }}
        run: |
          COMMAND=(
            run-with-priority
            swiftly run swift ${TOOLCHAIN_MODIFIER}
            package
            -c release
            --package-path Benchmarks
            --allow-writing-to-package-directory
            benchmark thresholds update
            --path "${{ env.THRESHOLDS_PATH }}"
            --run-count "${RUN_COUNT}"
            --range
          )

          if [[ -n "${TARGET}" ]]; then
            COMMAND+=(--target "${TARGET}")
          fi

          if [[ -n "${FILTER}" ]]; then
            COMMAND+=(--filter "${FILTER}")
          fi

          if [[ -n "${SKIP}" ]]; then
            COMMAND+=(--skip "${SKIP}")
          fi

          "${COMMAND[@]}" 2>&1 | grep 'Running the command multiple times'

      - name: Cache .build
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Benchmarks/.build
          key: "swiftpm-benchmark-build-${{ runner.os }}-${{ steps.swift-toolchain.outputs.version }}-${{ github.sha }}"

      - name: Wait for swift processes to exit
        if: always()
        run: .github/scripts/wait-for-swift-exit.sh

      - name: Floor static thresholds and baselines
        if: always()
        run: |
          THRESHOLDS_PATH='${{ env.THRESHOLDS_PATH }}' .github/scripts/floor-thresholds.sh

      - name: Check for modifications
        id: check-modifications
        if: always()
        run: |
          MODIFICATIONS="$(git status --porcelain "${{ env.THRESHOLDS_PATH }}")"
          if [[ -n "${MODIFICATIONS}" ]]; then
            printf '%s\n' "has-modifications=true" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "changes-count=$(printf '%s\n' "${MODIFICATIONS}" | awk '{print $2}' | uniq | wc -l)" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "has-modifications=false" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "changes-count=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log threshold changes against main as backup
        if: always()
        env:
          BASE_BRANCH: main
        run: .github/scripts/log-threshold-changes.sh

      - name: Regenerate swift-dns-helper token
        if: always()
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SWIFT_DNS_HELPER_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_DNS_HELPER_PRIVATE_KEY }}

      - name: Commit threshold changes to another branch
        if: always() && (steps.check-modifications.outputs.has-modifications == 'true')
        id: commit-update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          WORK_DIR: "."
          PATHSPEC: ${{ env.THRESHOLDS_PATH }}
        run: |
          CURRENT_BRANCH="${{ github.head_ref || github.ref_name }}"
          NEW_BRANCH="auto-thr-update/${CURRENT_BRANCH}"

          printf '%s\n' "new-branch=${NEW_BRANCH}" >> "${GITHUB_OUTPUT}"

          BASE_SHA="$(git rev-parse "origin/${CURRENT_BRANCH}")"
          git checkout -B "${NEW_BRANCH}" "origin/${CURRENT_BRANCH}"

          BENCHMARKED_COMMIT="$(START_REF="${BASE_SHA}" .github/scripts/latest-non-bot-commit.sh)"
          COMMIT_MESSAGE="$(
            printf -- '%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n' \
              "Update of benchmark thresholds with the new baselines" \
              "Max run count: '${{ inputs.run_count }}'" \
              "Target: '${{ inputs.target }}'" \
              "Filter: '${{ inputs.filter }}'" \
              "Skip: '${{ inputs.skip }}'" \
              "Benchmarked commit: ${BENCHMARKED_COMMIT}" \
              "Committed to ${NEW_BRANCH} by ${RUN_LINK}"
          )"
          BRANCH="${NEW_BRANCH}"
          OUTPUT_FILE="${GITHUB_OUTPUT}"
          export BRANCH BASE_SHA COMMIT_MESSAGE OUTPUT_FILE

          .github/scripts/commit-signed.sh

      - name: Construct result comment
        if: always()
        run: |
          printf '%s\n' "## [Benchmark Thresholds Update](${RUN_LINK}) Report" >> comment.md
          printf '%s\n' 'Thresholds update completed with ${{ steps.check-modifications.outputs.changes-count }} files changed.' >> comment.md

          COMMIT_SHA='${{ steps.commit-update.outputs.commit-sha }}'
          if [[ -n "${COMMIT_SHA}" ]]; then
            SHORT_SHA="$(printf '%s' "${COMMIT_SHA}" | cut -c 1-7)"
            COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
            BRANCH_NAME="${{ steps.commit-update.outputs.new-branch }}"
            BRANCH_LINK="https://github.com/${{ github.repository }}/tree/${BRANCH_NAME}"
            printf '\n' >> comment.md
            printf '%s\n' "Pushed commit [${SHORT_SHA}](${COMMIT_LINK}) to branch [${BRANCH_NAME}](${BRANCH_LINK}) containing an update of current thresholds with the deviated baseline." >> comment.md
          fi

      - name: Update comment in PR
        if: always() && (inputs.pr_number != '')
        id: pr-comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ inputs.pr_number }}
          file-path: comment.md
          comment-tag: benchmark-thresholds-update-comment

      - name: Output the comment as job summary
        if: always()
        run: |
          cat comment.md >> "${GITHUB_STEP_SUMMARY}"
          if [[ -n '${{ inputs.pr_number }}' ]]; then
            printf '%s\n' 'Commented at ${{ steps.pr-comment.outputs.html-url }}' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Enable powersave mode
        if: always()
        run: set-perf-mode powersave
